<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Healthcare Hospital</h1>
    </header>
    <main class="login-container">
        <section class="login-image">
            <div class="image-overlay">
                <h2>Healthcare Hospital</h2>
                <p>
                    Quality healthcare, accessible when you need it.
                </p>
            </div>
        </section>
        <section class="reset-account">
            <h2>Reset Password</h2>
            <form action="login.html" method="get">
                <label for="new-password">New Password:</label>
                <input type="password" id="new-password" name="new-password" required>
                
                <label for="confirm-password">Confirm Password:</label>
                <input type="password" id="confirm-password" name="confirm-password" required>
             
                <button type="submit" class="btn btn-reset">Update Password</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Healthcare Hospital. All rights reserved.</p>
    </footer>
</body>
</html>
