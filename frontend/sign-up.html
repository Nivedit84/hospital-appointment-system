<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthcare Hospital - Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Healthcare Hospital</h1>
    </header>

    <main class="signup-container">
        <section class="signup-image">
            <div class="image-overlay">
                <h2>Healthcare Hospital</h2>
                <p>
                    Quality healthcare, accessible when you need it.
                </p>
            </div>
        </section>
        <section class="create-account">

            <h2>Create Account</h2>

            <form id="signupForm">

                <label for="full-name">Full Name:</label>
                <input type="text" id="full-name" name="full-name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
             

                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone" required>
                

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
                

                <label for="confirm-password">Confirm Password:</label>
                <input type="password" id="confirm-password" name="confirm-password" required>
                

                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob" required>
                

                <p>Gender:</p>

                <input type="radio" id="male" name="gender" value="male">
                <label for="male">Male</label>

                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label>

                <input type="radio" id="other" name="gender" value="other">
                <label for="other">Other</label>

                

                <button type="submit" class="btn btn-signup">Create Account</button>

            </form>
            <div class="last-line">
                <p>
                    Already have an account?
                    <a href="login.html">Login</a>
                </p>
            </div>


        </section>
<script src="signup.js"></script>
    </main>

    <footer>
        <p>&copy; 2026 Healthcare Hospital. All rights reserved.</p>
    </footer>

</body>
</html>
